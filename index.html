    <script>
      // Silence Vite HMR websocket disconnect noise in sandboxed preview iframe
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('createWebSocketModuleRunnerTransport') || e.message.includes('vite'))) {
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && String(e.reason).includes('WebSocket')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
